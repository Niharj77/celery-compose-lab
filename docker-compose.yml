
services:

  redis:
    image: redis:7-alpine
    container_name: celery-redis

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    networks:
      - backend

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    cpus: 0.25
    mem_limit: 192m


  api:
    build:
      context: ./app

    container_name: celery-api

    ports:
      - "8000:8000"

    environment:
      REDIS_URL: redis://redis:6379/0

    networks:
      - backend

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"
      interval: 15s
      timeout: 5s
      retries: 3

    restart: unless-stopped

    cpus: 0.5
    mem_limit: 384m


  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile

    container_name: celery-worker

    environment:
      REDIS_URL: redis://redis:6379/0

    networks:
      - backend

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

    cpus: 0.5
    mem_limit: 384m


networks:
  backend:
    driver: bridge
    internal: true


volumes:
  redis_data:
